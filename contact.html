<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RastaAsian Sanctuary</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<main>

    <!-- Hero Banner -->
    <section class="hero" style="background-image: url('images/contact-hero.jpg');">
        <h2>Contact Me</h2>
        <p>Have a question, collaboration idea, or just want to say hi?</p>
    </section>

    <!-- Contact Form -->
    <section style="padding: 40px 20px; max-width: 700px; margin: auto;">
        <h2 style="text-align:center;">Send a Message</h2>

        <form action="https://formspree.io/f/mlgeazpj" method="POST" style="margin-top: 30px;">

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn" style="margin-top: 15px;">Send Message</button>

        </form>
    </section>

</main>

</body>
</html>
