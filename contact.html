<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RastaAsian Sanctuary</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* Purple Glow Social Icons */
        .sanctuary-socials {
            display: flex;
            gap: 1.4rem;
            justify-content: center;
            align-items: center;
            padding: 40px 0 60px;
        }

        .sanctuary-socials a {
            color: #c8a2ff; /* lavender base */
            font-size: 1.8rem;
            transition:
                color 0.25s ease,
                transform 0.25s ease,
                text-shadow 0.25s ease;
        }

        .sanctuary-socials a:hover {
            color: #e5c7ff; /* brighter purple */
            transform: translateY(-3px);
            text-shadow:
                0 0 8px rgba(180, 120, 255, 0.8),
                0 0 14px rgba(160, 80, 255, 0.6),
                0 0 22px rgba(140, 60, 255, 0.5);
        }
    </style>
</head>

<body>

<main>

    <!-- Hero Banner -->
    <section class="hero" style="background-image: url('images/contact-hero.jpg');">
        <h2>Contact Me</h2>
        <p>Have a question, collaboration idea, or just want to say hi?</p>
    </section>

    <!-- Contact Form -->
    <section style="padding: 40px 20px; max-width: 700px; margin: auto;">
        <h2 style="text-align:center;">Send a Message</h2>

        <form action="https://formspree.io/f/mlgeazpj" method="POST" style="margin-top: 30px;">

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn" style="margin-top: 15px;">Send Message</button>

        </form>
    </section>

    <!-- Social Icons -->
   <div class="sanctuary-socials">

    <a href="https://www.youtube.com/@rastaasian" target="_blank" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
    </a>

    <a href="https://www.tiktok.com/@rastaasian" target="_blank" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
    </a>

    <a href="https://www.instagram.com/rastaasian888" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="https://github.com/rastaasian" target="_blank" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
    </a>

    <a href="https://www.twitch.tv/rastaasian" target="_blank" aria-label="Twitch">
        <i class="fa-brands fa-twitch"></i>
    </a>

    <a href="https://discord.gg/EQh4h47R" target="_blank" aria-label="Discord Server">
        <i class="fa-brands fa-discord"></i>
    </a>

</div>



</main>

</body>
</html>
