<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RastaAsian Sanctuary</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- Persistent Music Player -->
<audio id="bg-music" autoplay loop>
    <source src="audio/ytmp3free.cc_gorillaz-dare-official-video-youtubemp3free.org.mp3" type="audio/mpeg">
</audio>

<header>

    <!-- Mobile Hamburger -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <h1>RastaAsian Sanctuary</h1>

    <!-- Navigation -->
    <nav>
        <ul class="mobile-hidden">
            <li><a href="home.html" target="content-frame" class="active">Home</a></li>
            <li><a href="about.html" target="content-frame">About</a></li>
            <li><a href="games.html" target="content-frame">Games & Streams</a></li>
            <li><a href="setup.html" target="content-frame">Setup & Gear</a></li>
            <li><a href="events.html" target="content-frame">Events</a></li>
            <li><a href="services.html" target="content-frame">Services</a></li>
            <li><a href="contact.html" target="content-frame">Contact</a></li>
        </ul>
    </nav>

</header>

<!-- This is where all your pages load -->
<iframe 
    name="content-frame"
    src="home.html"
    style="width: 100%; height: 85vh; border: none; background: var(--black);">
</iframe>

<footer>
    © 2025 RastaAsian Sanctuary. All rights reserved.
    <div class="social-icons">
        <span class="icon">🌙</span>
        <span class="icon">🕸️</span>
        <span class="icon">💜</span>
    </div>
</footer>

<!-- Mobile Menu Script -->
<script>
const hamburger = document.getElementById('hamburger');
const navMenu = document.querySelector('nav ul');

// Toggle mobile menu
hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    navMenu.classList.toggle('mobile-hidden');
});

// Close menu after clicking a link (mobile UX best practice)
document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
        navMenu.classList.add('mobile-hidden');
        hamburger.classList.remove('active');
    });
});
</script>

</body>
</html>
