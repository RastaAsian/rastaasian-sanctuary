<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RastaAsian Sanctuary</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* Fade transition for SPA content */
        #content {
            opacity: 0;
            transition: opacity 0.6s ease;
            min-height: 60vh;
        }
        #content.fade-in {
            opacity: 1;
        }
    </style>
</head>

<body>

<!-- Persistent Music Player -->
<audio id="bg-music" autoplay loop muted>
    <source src="css/audio/ytmp3free.cc_gorillaz-dare-official-video-youtubemp3free.org.mp3" type="audio/mpeg">
</audio>

<header>

    <!-- Mobile Hamburger -->
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <h1>RastaAsian Sanctuary</h1>

    <!-- Navigation -->
    <nav>
        <ul id="nav-links">
            <li><a href="#home" data-page="home.html" class="active">Home</a></li>
            <li><a href="#about" data-page="about.html">About</a></li>
            <li><a href="#games" data-page="games.html">Games & Streams</a></li>
            <li><a href="#setup" data-page="setup.html">Setup & Gear</a></li>
            <li><a href="#events" data-page="events.html">Events</a></li>
            <li><a href="#services" data-page="services.html">Services</a></li>
            <li><a href="#contact" data-page="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>

<!-- MAIN CONTENT AREA -->
<main id="content"></main>

<!-- Floating Music Orb with Visualizer -->
<div id="music-orb">
    <div id="visualizer">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>
</div>

<footer>
    © 2025 RastaAsian Sanctuary. All rights reserved.
    <div class="social-icons">
        <span class="icon">🌙</span>
        <span class="icon">🕸️</span>
        <span class="icon">💜</span>
    </div>
</footer>

<!-- SPA LOADER SCRIPT -->
<script>
const content = document.getElementById("content");

// Load page with fade transition
async function loadPage(page) {
    content.classList.remove("fade-in");

    const response = await fetch("partials/" + page);
    let html = await response.text();

    // Strip full HTML wrapper if present
    html = html.replace(/<!DOCTYPE[\s\S]*?<body.*?>/i, "")
               .replace(/<\/body>[\s\S]*?<\/html>/i, "");

    content.innerHTML = html;

    setTimeout(() => {
        content.classList.add("fade-in");
    }, 50);
}

// Handle hash routing
function handleHash() {
    const page = location.hash.replace("#", "") || "home";
    loadPage(page + ".html");
}

// Listen for hash changes
window.addEventListener("hashchange", handleHash);

// Initial load
handleHash();
</script>

<!-- MUSIC ORB SCRIPT -->
<script>
const music = document.getElementById("bg-music");
const orb = document.getElementById("music-orb");

// Start muted (browser‑safe)
music.volume = 0;

// Auto‑fade after page load
window.addEventListener("load", () => {
    let vol = 0;
    music.muted = false;
    music.play().catch(() => {});

    const fade = setInterval(() => {
        if (vol < 1) {
            vol += 0.02; 
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 120);
});

// Orb toggle play/pause
orb.addEventListener("click", () => {
    if (music.paused) {
        music.play().catch(() => {});
        orb.classList.remove("paused");
    } else {
        music.pause();
        orb.classList.add("paused");
    }
});

// Resume when returning to tab
document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !orb.classList.contains("paused")) {
        music.play().catch(() => {});
    }
});

// Resume after window refocus
window.addEventListener("focus", () => {
    if (!orb.classList.contains("paused")) {
        music.play().catch(() => {});
    }
});
</script>

</body>
</html>
